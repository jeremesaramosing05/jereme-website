name: chess_app
description: "An offline chess training app — play, analyze, and improve with a Stockfish coaching brain."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Chess board UI + rules (Lichess, GPL-3.0)
  chessground: ^10.0.0
  dartchess: ^0.13.0

  # On-device Stockfish 18 via FFI (offline, GPL-3.0)
  stockfish: ^1.8.0

  # State management (no codegen variant — keeps build to one command)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Lightweight persistence (no codegen)
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Misc
  collection: ^1.18.0
  intl: ^0.19.0
  # Used by chessground for ISet<Shape> / IMap validMoves; imported directly.
  fast_immutable_collections: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/puzzles.csv
    - assets/book/
