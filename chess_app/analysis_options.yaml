include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: false # we use debugPrint, but allow print in the engine smoke screen

analyzer:
  errors:
    # dartchess/chessground evolve quickly; keep these as warnings, not build-blockers
    deprecated_member_use: warning
