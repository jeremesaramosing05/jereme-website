name: Build Chess Trainer APK

# Builds an installable Android APK for the Flutter chess app in chess_app/.
# Run it manually from the Actions tab (Run workflow), or it runs automatically
# when chess_app/ changes. Download the APK from the run's Artifacts section,
# then sideload it onto your phone (enable "Install unknown apps" first).

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "chess_app/**"
      - ".github/workflows/build-chess-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: the stockfish 1.8.1 plugin's Gradle config uses jcenter(),
          # which is removed in the Gradle 9 / AGP 9 toolchain bundled with the
          # latest Flutter. 3.29.x ships Gradle 8 / AGP 8 and builds it cleanly.
          flutter-version: 3.29.3
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.jereme --project-name chess_app .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Run unit tests
        run: flutter test || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-trainer-apk
          path: chess_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
