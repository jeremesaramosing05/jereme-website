<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="POS and Inventory System cover — a point-of-sale interface with product tiles, a cart total, and a receipt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1ec"/>
      <stop offset="1" stop-color="#dde6df"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6f49"/>
      <stop offset="1" stop-color="#7a5333"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#3a4a40" flood-opacity="0.16"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3a4a40" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1070" cy="140" r="260" fill="#cdded2" opacity="0.5"/>
  <circle cx="180" cy="650" r="200" fill="#cfdcd3" opacity="0.45"/>

  <!-- Label -->
  <g transform="translate(96,92)">
    <rect x="0" y="0" width="208" height="40" rx="20" fill="#ffffff" opacity="0.8"/>
    <circle cx="24" cy="20" r="7" fill="#8a6240"/>
    <text x="44" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#3f4a43" letter-spacing="0.5">Point of Sale</text>
  </g>

  <!-- ===== POS app card ===== -->
  <g filter="url(#soft)">
    <rect x="96" y="170" width="560" height="430" rx="26" fill="url(#card)"/>
  </g>
  <g transform="translate(96,170)">
    <!-- header -->
    <text x="36" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#1c1b1a">My Store</text>
    <text x="38" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a847b" letter-spacing="0.5">CASHIER · TERMINAL 01</text>
    <g transform="translate(456,34)">
      <rect x="0" y="0" width="68" height="34" rx="17" fill="#f1ece4"/>
      <text x="34" y="23" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8a6240">₱ POS</text>
    </g>
    <line x1="36" y1="112" x2="524" y2="112" stroke="#ece8e1" stroke-width="2"/>

    <!-- product tiles -->
    <g font-family="Helvetica, Arial, sans-serif">
      <g transform="translate(36,134)">
        <rect width="150" height="96" rx="12" fill="#f7f5f0" stroke="#ece8e1"/>
        <text x="16" y="38" font-size="18" fill="#1c1b1a" font-weight="bold">Coffee</text>
        <text x="16" y="64" font-size="18" fill="#8a6240">₱75.00</text>
        <text x="16" y="84" font-size="12" fill="#9a948b">50 in stock</text>
      </g>
      <g transform="translate(205,134)">
        <rect width="150" height="96" rx="12" fill="#f7f5f0" stroke="#ece8e1"/>
        <text x="16" y="38" font-size="18" fill="#1c1b1a" font-weight="bold">Sandwich</text>
        <text x="16" y="64" font-size="18" fill="#8a6240">₱120.00</text>
        <text x="16" y="84" font-size="12" fill="#9a948b">20 in stock</text>
      </g>
      <g transform="translate(374,134)">
        <rect width="150" height="96" rx="12" fill="#f7f5f0" stroke="#ece8e1"/>
        <text x="16" y="34" font-size="18" fill="#1c1b1a" font-weight="bold">Bottled</text>
        <text x="16" y="54" font-size="18" fill="#1c1b1a" font-weight="bold">Water</text>
        <text x="16" y="80" font-size="18" fill="#8a6240">₱30.00</text>
      </g>
    </g>

    <!-- total + button -->
    <line x1="36" y1="262" x2="524" y2="262" stroke="#ece8e1" stroke-width="2"/>
    <text x="36" y="300" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8a847b">2 items in cart</text>
    <text x="36" y="334" font-family="Georgia, serif" font-size="24" fill="#1c1b1a">Total</text>
    <text x="524" y="334" text-anchor="end" font-family="Georgia, serif" font-size="30" fill="#8a6240" font-weight="bold">₱270.00</text>
    <g transform="translate(36,356)">
      <rect width="488" height="46" rx="23" fill="url(#bronze)"/>
      <text x="244" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" letter-spacing="0.3">Complete sale</text>
    </g>
  </g>

  <!-- ===== Receipt ===== -->
  <g transform="translate(760,150) rotate(4)" filter="url(#soft2)" font-family="'Courier New', monospace">
    <rect x="0" y="0" width="300" height="446" rx="8" fill="#ffffff"/>
    <text x="150" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1c1b1a" font-weight="bold">My Store</text>
    <text x="150" y="78" text-anchor="middle" font-size="14" fill="#8a847b">Sales Receipt</text>
    <line x1="24" y1="98" x2="276" y2="98" stroke="#d8d3ca" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="24" y="124" font-size="13" fill="#5b554d">TXN: TX17800186…</text>
    <text x="24" y="146" font-size="13" fill="#5b554d">Cashier: jereme</text>
    <line x1="24" y1="164" x2="276" y2="164" stroke="#d8d3ca" stroke-width="1.5" stroke-dasharray="5 5"/>

    <text x="24" y="196" font-size="14" fill="#1c1b1a">Coffee ×2</text>
    <text x="276" y="196" text-anchor="end" font-size="14" fill="#1c1b1a">₱150.00</text>
    <text x="24" y="224" font-size="14" fill="#1c1b1a">Sandwich ×1</text>
    <text x="276" y="224" text-anchor="end" font-size="14" fill="#1c1b1a">₱120.00</text>
    <line x1="24" y1="246" x2="276" y2="246" stroke="#d8d3ca" stroke-width="1.5" stroke-dasharray="5 5"/>

    <text x="24" y="276" font-size="14" fill="#5b554d">Subtotal</text>
    <text x="276" y="276" text-anchor="end" font-size="14" fill="#5b554d">₱270.00</text>
    <text x="24" y="300" font-size="14" fill="#5b554d">Discount</text>
    <text x="276" y="300" text-anchor="end" font-size="14" fill="#5b554d">₱0.00</text>
    <text x="24" y="332" font-size="17" fill="#1c1b1a" font-weight="bold">Grand Total</text>
    <text x="276" y="332" text-anchor="end" font-size="17" fill="#8a6240" font-weight="bold">₱270.00</text>
    <line x1="24" y1="352" x2="276" y2="352" stroke="#d8d3ca" stroke-width="1.5" stroke-dasharray="5 5"/>

    <g transform="translate(150,392)">
      <circle cx="0" cy="0" r="22" fill="#e9f1ea"/>
      <path d="M -9 1 L -3 8 L 10 -7" fill="none" stroke="#3f8254" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="150" y="436" text-anchor="middle" font-size="14" fill="#5b554d">Thank you!</text>
  </g>
</svg>
