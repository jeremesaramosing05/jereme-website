<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Data Analyst Dashboard cover — a dashboard with KPI cards, a bar chart, a trend line, and an insights panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f8"/>
      <stop offset="1" stop-color="#e2e6f4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfbfe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#3a3f6a" flood-opacity="0.16"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3a3f6a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="130" r="260" fill="#d3d9f1" opacity="0.55"/>
  <circle cx="170" cy="650" r="200" fill="#d6dcef" opacity="0.5"/>

  <!-- Label -->
  <g transform="translate(96,92)">
    <rect x="0" y="0" width="228" height="40" rx="20" fill="#ffffff" opacity="0.85"/>
    <circle cx="24" cy="20" r="7" fill="#6366f1"/>
    <text x="44" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#3a3f5a" letter-spacing="0.5">Data Dashboard</text>
  </g>

  <!-- ===== Main dashboard card ===== -->
  <g filter="url(#soft)">
    <rect x="96" y="170" width="700" height="430" rx="26" fill="url(#card)"/>
  </g>
  <g transform="translate(96,170)">
    <text x="36" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1b1c2a">Sales overview</text>
    <text x="38" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#857f9a" letter-spacing="0.5">AUTO-GENERATED · 48,920 ROWS</text>
    <line x1="36" y1="104" x2="664" y2="104" stroke="#ecebf3" stroke-width="2"/>

    <!-- KPI tiles -->
    <g font-family="Helvetica, Arial, sans-serif">
      <g transform="translate(36,124)">
        <rect width="148" height="88" rx="12" fill="#f6f6fc" stroke="#ecebf3"/>
        <text x="16" y="32" font-size="12" fill="#857f9a">Revenue</text>
        <text x="16" y="60" font-size="24" fill="#1b1c2a" font-weight="bold">$4.82M</text>
        <text x="16" y="78" font-size="12" fill="#1d9e75">▲ 18.4%</text>
      </g>
      <g transform="translate(196,124)">
        <rect width="148" height="88" rx="12" fill="#f6f6fc" stroke="#ecebf3"/>
        <text x="16" y="32" font-size="12" fill="#857f9a">Orders</text>
        <text x="16" y="60" font-size="24" fill="#1b1c2a" font-weight="bold">48,920</text>
        <text x="16" y="78" font-size="12" fill="#1d9e75">▲ 11.2%</text>
      </g>
      <g transform="translate(356,124)">
        <rect width="148" height="88" rx="12" fill="#f6f6fc" stroke="#ecebf3"/>
        <text x="16" y="32" font-size="12" fill="#857f9a">Avg order</text>
        <text x="16" y="60" font-size="24" fill="#1b1c2a" font-weight="bold">$98.50</text>
        <text x="16" y="78" font-size="12" fill="#1d9e75">▲ 6.4%</text>
      </g>
      <g transform="translate(516,124)">
        <rect width="148" height="88" rx="12" fill="#f6f6fc" stroke="#ecebf3"/>
        <text x="16" y="32" font-size="12" fill="#857f9a">Return rate</text>
        <text x="16" y="60" font-size="24" fill="#1b1c2a" font-weight="bold">3.1%</text>
        <text x="16" y="78" font-size="12" fill="#857f9a">▼ 0.8 pt</text>
      </g>
    </g>

    <!-- Trend area with line -->
    <g transform="translate(36,236)">
      <rect width="380" height="160" rx="12" fill="#fbfbfe" stroke="#ecebf3"/>
      <polyline points="20,128 70,118 120,124 170,96 220,100 270,66 320,52 360,28" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="20,128 70,118 120,124 170,96 220,100 270,66 320,52 360,28 360,140 20,140" fill="#6366f1" opacity="0.08"/>
    </g>

    <!-- Bar chart -->
    <g transform="translate(436,236)" font-family="Helvetica, Arial, sans-serif">
      <rect width="228" height="160" rx="12" fill="#fbfbfe" stroke="#ecebf3"/>
      <rect x="26" y="86" width="30" height="54" rx="4" fill="#6366f1"/>
      <rect x="70" y="62" width="30" height="78" rx="4" fill="#6366f1"/>
      <rect x="114" y="40" width="30" height="100" rx="4" fill="#818cf8"/>
      <rect x="158" y="72" width="30" height="68" rx="4" fill="#22d3ee"/>
    </g>
  </g>

  <!-- ===== Insights card ===== -->
  <g transform="translate(852,196) rotate(3)" filter="url(#soft2)" font-family="Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="300" height="360" rx="16" fill="#ffffff"/>
    <g transform="translate(28,40)">
      <circle cx="12" cy="6" r="13" fill="#eef0fe"/>
      <text x="6" y="12" font-size="16">💡</text>
      <text x="40" y="2" font-family="Georgia, serif" font-size="19" fill="#1b1c2a">Insights</text>
      <text x="40" y="24" font-size="12" fill="#857f9a">7 found · auto-written</text>
    </g>
    <line x1="28" y1="78" x2="272" y2="78" stroke="#eeedf4" stroke-width="1.5"/>

    <g transform="translate(28,100)">
      <rect width="244" height="74" rx="10" fill="#f7f7fc"/>
      <text x="16" y="26" font-size="13" fill="#1b1c2a" font-weight="bold">December was your best month</text>
      <text x="16" y="48" font-size="12" fill="#6b6680">Nearly triple your slowest. Stock up</text>
      <text x="16" y="64" font-size="12" fill="#6b6680">before the Q4 peak.</text>
    </g>
    <g transform="translate(28,186)">
      <rect width="244" height="74" rx="10" fill="#f7f7fc"/>
      <text x="16" y="26" font-size="13" fill="#1b1c2a" font-weight="bold">Luzon drives 42% of revenue</text>
      <text x="16" y="48" font-size="12" fill="#6b6680">A strength — but grow a second</text>
      <text x="16" y="64" font-size="12" fill="#6b6680">region to reduce the risk.</text>
    </g>
    <g transform="translate(28,272)">
      <rect width="244" height="56" rx="10" fill="#eef0fe"/>
      <text x="16" y="24" font-size="12" fill="#4f46b3" font-weight="bold">RECOMMENDATION</text>
      <text x="16" y="44" font-size="12" fill="#4338ca">Test mid-tier bundles next quarter.</text>
    </g>
  </g>
</svg>
