<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Cost &amp; Estimate App cover — a construction cost estimator showing a house, a materials list, and a peso total">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf6f0"/>
      <stop offset="1" stop-color="#f1e7da"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- left: brand + tagline -->
  <g transform="translate(96,150)">
    <rect width="96" height="96" rx="22" fill="#e07a3f"/>
    <path d="M48 22 L84 52 L75 52 L75 82 L21 82 L21 52 L12 52 Z" fill="#ffffff"/>
    <rect x="39" y="60" width="18" height="22" fill="#e07a3f"/>
    <text x="120" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#1f2421">Cost &amp; Estimate</text>
    <text x="122" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#5b6360">Construction cost estimating for everyone</text>
  </g>
  <g transform="translate(96,310)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="0" font-size="24" fill="#3c4490" opacity="0"></text>
    <text x="0" y="0" font-size="25" fill="#5b6360">Built for Filipino builders — engineers and homeowners.</text>
    <g transform="translate(0,40)" font-size="22" font-weight="600">
      <rect x="0" y="-26" width="150" height="40" rx="20" fill="#fbeae0"/><text x="22" y="2" fill="#6e3413">10 estimators</text>
      <rect x="166" y="-26" width="178" height="40" rx="20" fill="#e1f5ee"/><text x="188" y="2" fill="#0f6e56">Regional prices</text>
      <rect x="360" y="-26" width="186" height="40" rx="20" fill="#dbeaf5"/><text x="382" y="2" fill="#185fa5">Proposal PDF</text>
    </g>
  </g>

  <!-- right: stylized estimate card -->
  <g transform="translate(740,140)">
    <rect width="440" height="440" rx="24" fill="#ffffff" stroke="#e4e0d8" stroke-width="2"/>
    <rect x="0" y="0" width="440" height="74" rx="24" fill="#e07a3f"/>
    <rect x="0" y="40" width="440" height="34" fill="#e07a3f"/>
    <text x="30" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Bill of materials</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#1f2421">
      <text x="30" y="128">Cement (40kg)</text><text x="410" y="128" text-anchor="end" fill="#5b6360">52 bags</text>
      <line x1="30" y1="146" x2="410" y2="146" stroke="#eee" stroke-width="1.5"/>
      <text x="30" y="186">CHB 4&quot;</text><text x="410" y="186" text-anchor="end" fill="#5b6360">1,134 pcs</text>
      <line x1="30" y1="204" x2="410" y2="204" stroke="#eee" stroke-width="1.5"/>
      <text x="30" y="244">Rebar (Grade 60)</text><text x="410" y="244" text-anchor="end" fill="#5b6360">477 kg</text>
      <line x1="30" y1="262" x2="410" y2="262" stroke="#eee" stroke-width="1.5"/>
      <text x="30" y="302">Roofing — GI sheets</text><text x="410" y="302" text-anchor="end" fill="#5b6360">20 sheets</text>
    </g>
    <rect x="0" y="356" width="440" height="84" rx="24" fill="#1f2421"/>
    <rect x="0" y="356" width="440" height="40" fill="#1f2421"/>
    <text x="30" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cfcabf">Total contract price</text>
    <text x="410" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="end">&#8369;192,647</text>
  </g>
</svg>
